<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#F7F3E9" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="伴办：一句话记下待办，自动识别时间、优先级和重复规则。手机优先、离线可用、数据只存在本机。" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="伴办" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./assets/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" />
    <title>伴办 · 今天也一件件来</title>
    <link rel="stylesheet" href="./assets/app.css" />
  </head>
  <body>
    <div class="ambient" aria-hidden="true"></div>
    <div class="app-shell" id="appShell">
      <div class="offline-banner" id="offlineBanner" hidden>
        <span class="offline-dot"></span> 现在离线，数据仍会保存在本机
      </div>
      <main class="view" id="view" tabindex="-1"></main>

      <nav class="tabbar" id="tabbar" aria-label="主导航">
        <a class="tab" href="#/today" data-tab="today" aria-label="今日">
          <span class="tab-ico" data-icon="today"></span>
          <span class="tab-label">今日</span>
        </a>
        <a class="tab" href="#/calendar" data-tab="calendar" aria-label="日历">
          <span class="tab-ico" data-icon="calendar"></span>
          <span class="tab-label">日历</span>
        </a>
        <button class="tab-add" data-action="open-composer" aria-label="新建任务">
          <span data-icon="plus"></span>
        </button>
        <a class="tab" href="#/inbox" data-tab="inbox" aria-label="收件箱">
          <span class="tab-ico" data-icon="inbox"></span>
          <span class="tab-label">收件箱</span>
        </a>
        <a class="tab" href="#/settings" data-tab="settings" aria-label="设置">
          <span class="tab-ico" data-icon="settings"></span>
          <span class="tab-label">设置</span>
        </a>
      </nav>

      <div id="overlayRoot"></div>
      <div id="confirmRoot"></div>
      <div id="toastRoot" class="toast-root" aria-live="polite" aria-atomic="false"></div>
    </div>

    <script src="./js/util.js"></script>
    <script src="./js/parser.js"></script>
    <script src="./js/store.js"></script>
    <script src="./js/notify.js"></script>
    <script src="./js/native.js"></script>
    <script src="./js/ui.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
